<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="280" height="130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6bb8"/>
      <stop offset="50%" stop-color="#2a8fd4"/>
      <stop offset="100%" stop-color="#1a5a9e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#e8a800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Main bill body -->
  <rect x="2" y="2" width="276" height="126" rx="8" ry="8" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="264" height="114" rx="4" ry="4" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Left accent bar -->
  <rect x="8" y="8" width="40" height="114" rx="4" ry="4" fill="url(#accent)" opacity="0.9"/>
  <!-- Right accent bar -->
  <rect x="232" y="8" width="40" height="114" rx="4" ry="4" fill="url(#accent)" opacity="0.9"/>
  <!-- Central circle (portrait area) -->
  <circle cx="140" cy="65" r="38" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Portrait silhouette -->
  <ellipse cx="140" cy="55" rx="14" ry="16" fill="rgba(255,255,255,0.5)"/>
  <path d="M120,90 Q140,75 160,90 L160,100 L120,100 Z" fill="rgba(255,255,255,0.5)"/>
  <!-- "50" large -->
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">50</text>
  <text x="220" y="78" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">50</text>
  <!-- "REAIS" text -->
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">REAIS</text>
  <text x="220" y="95" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="rgba(255,255,255,0.7)" text-anchor="middle">REAIS</text>
  <!-- Top text -->
  <text x="140" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.8)" text-anchor="middle" letter-spacing="2">BANCO CENTRAL DO BRASIL</text>
  <!-- Bottom text -->
  <text x="140" y="118" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.6)" text-anchor="middle">CINQUENTA REAIS</text>
  <!-- Decorative lines -->
  <line x1="50" y1="105" x2="90" y2="105" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <line x1="190" y1="105" x2="230" y2="105" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <!-- Serial number -->
  <text x="140" y="32" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle">A12345678B</text>
</svg>
