<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="280" height="130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6bb5"/>
      <stop offset="30%" stop-color="#2d8fd8"/>
      <stop offset="70%" stop-color="#3aaae8"/>
      <stop offset="100%" stop-color="#1a5a9e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d020"/>
      <stop offset="100%" stop-color="#d4a000"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.5" fill="rgba(255,255,255,0.15)"/>
    </pattern>
  </defs>
  <!-- Main bill body -->
  <rect x="2" y="2" width="276" height="126" rx="10" ry="10" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Dots pattern overlay -->
  <rect x="8" y="8" width="264" height="114" rx="4" ry="4" fill="url(#dots)"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="264" height="114" rx="4" ry="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Left accent stripe -->
  <rect x="8" y="8" width="36" height="114" rx="4" ry="4" fill="url(#accent)" opacity="0.85"/>
  <!-- Right accent stripe -->
  <rect x="236" y="8" width="36" height="114" rx="4" ry="4" fill="url(#accent)" opacity="0.85"/>
  <!-- Shine overlay -->
  <rect x="2" y="2" width="276" height="126" rx="10" ry="10" fill="url(#shine)"/>
  <!-- Central medallion -->
  <circle cx="140" cy="65" r="36" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="140" cy="65" r="30" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Portrait silhouette -->
  <ellipse cx="140" cy="56" rx="12" ry="14" fill="rgba(255,255,255,0.55)"/>
  <path d="M122,88 Q140,72 158,88 L158,96 L122,96 Z" fill="rgba(255,255,255,0.55)"/>
  <!-- "50" large left -->
  <text x="50" y="72" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="rgba(255,255,255,0.95)" text-anchor="middle" letter-spacing="-2">50</text>
  <!-- "50" large right -->
  <text x="230" y="72" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="rgba(255,255,255,0.95)" text-anchor="middle" letter-spacing="-2">50</text>
  <!-- Top text -->
  <text x="140" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="3">BANCO CENTRAL DO BRASIL</text>
  <!-- "REAIS" under 50s -->
  <text x="50" y="88" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.6)" text-anchor="middle">REAIS</text>
  <text x="230" y="88" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.6)" text-anchor="middle">REAIS</text>
  <!-- Bottom text -->
  <text x="140" y="112" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle">CINQUENTA REAIS</text>
  <!-- Serial number -->
  <text x="140" y="30" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">A 12345678 B</text>
  <!-- Decorative corner marks -->
  <path d="M12,12 L20,12 M12,12 L12,20" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <path d="M268,12 L260,12 M268,12 L268,20" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <path d="M12,118 L20,118 M12,118 L12,110" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <path d="M268,118 L260,118 M268,118 L268,110" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
</svg>
