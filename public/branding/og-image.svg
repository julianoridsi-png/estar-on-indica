<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F5FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D2DD3A"/>
      <stop offset="100%" stop-color="#b8c432"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.06" stroke="#D2DD3A" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
  </g>
  <!-- lime accent blob -->
  <circle cx="980" cy="120" r="220" fill="#D2DD3A" opacity="0.12"/>
  <circle cx="1100" cy="520" r="160" fill="#31393F" opacity="0.05"/>

  <!-- left content -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#D2DD3A"/>
    <text x="75" y="22" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#31393F" text-anchor="middle" letter-spacing="1.2">PROGRAMA OFICIAL</text>

    <text x="0" y="110" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#31393F">Estar On</text>
    <text x="0" y="180" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#D2DD3A">Indica</text>

    <text x="0" y="235" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="500" fill="#5c6a66">Indique amigos e acompanhe</text>
    <text x="0" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="500" fill="#5c6a66">cada etapa em tempo real.</text>

    <!-- R$ 50 badge -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="230" height="74" rx="37" fill="#D2DD3A"/>
      <text x="115" y="32" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#31393F" text-anchor="middle" letter-spacing="1.2">GANHE</text>
      <text x="115" y="60" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="800" fill="#31393F" text-anchor="middle">R$ 50 por amigo</text>
    </g>

    <text x="0" y="420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="500" fill="#5c6a66">Recompensas liberadas após validação da equipe Estar On.</text>
  </g>

  <!-- phone mockup -->
  <g transform="translate(760, 70)">
    <rect x="0" y="0" width="320" height="490" rx="44" fill="#31393F"/>
    <rect x="12" y="12" width="296" height="466" rx="34" fill="#FFFFFF"/>
    <rect x="118" y="24" width="84" height="6" rx="3" fill="#31393F" opacity="0.25"/>

    <g transform="translate(32, 60)">
      <text x="0" y="0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#D2DD3A" letter-spacing="1.5">ACOMPANHAMENTO</text>
      <text x="0" y="26" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#31393F">Sua indicação</text>

      <!-- progress bar -->
      <rect x="0" y="44" width="256" height="8" rx="4" fill="#eef0ea"/>
      <rect x="0" y="44" width="154" height="8" rx="4" fill="#D2DD3A"/>
      <text x="256" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#5c6a66" text-anchor="end">3 de 6</text>

      <!-- steps -->
      <g transform="translate(0, 74)">
        <!-- done -->
        <circle cx="12" cy="12" r="10" fill="#10b981"/>
        <text x="12" y="16" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="32" y="16" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#31393F">Indicação recebida</text>
        <text x="32" y="30" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#5c6a66">Concluído</text>

        <line x1="12" y1="24" x2="12" y2="46" stroke="#e2e6da" stroke-width="2"/>

        <circle cx="12" cy="58" r="10" fill="#10b981"/>
        <text x="12" y="62" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="32" y="62" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#31393F">Em análise</text>
        <text x="32" y="76" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#5c6a66">Concluído</text>

        <line x1="12" y1="70" x2="12" y2="92" stroke="#e2e6da" stroke-width="2"/>

        <circle cx="12" cy="104" r="10" fill="#D2DD3A"/>
        <circle cx="12" cy="104" r="4" fill="#31393F"/>
        <text x="32" y="108" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#31393F">Contrato aprovado</text>
        <text x="32" y="122" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#D2DD3A" font-weight="600">Em andamento</text>

        <line x1="12" y1="116" x2="12" y2="138" stroke="#e2e6da" stroke-width="2" stroke-dasharray="3 3"/>

        <circle cx="12" cy="150" r="10" fill="#FFFFFF" stroke="#e2e6da" stroke-width="2"/>
        <text x="32" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#9aa82e">Instalação agendada</text>
        <text x="32" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" fill="#9aa82e">Aguardando</text>
      </g>
    </g>
  </g>

  <!-- footer brand mark -->
  <text x="80" y="590" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#9aa82e">estar-on-indica.julianoridsi.workers.dev</text>
</svg>